# Configuration for auto-generated release notes
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - skip-changelog
      - dependencies
    authors:
      - dependabot
      - dependabot[bot]

  categories:
    - title: "⚠️ Breaking Changes"
      labels:
        - breaking
        - breaking-change

    - title: "🚀 Features"
      labels:
        - feature
        - enhancement

    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - bugfix
        - fix

    - title: "📚 Documentation"
      labels:
        - documentation
        - docs

    - title: "🧹 Maintenance"
      labels:
        - chore
        - maintenance
        - refactor

    - title: "Other Changes"
      labels:
        - "*"
