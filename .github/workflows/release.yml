name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to create (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/tests.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    name: Tag and publish release

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        env:
          RELEASE_REF: ${{ github.ref }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
            echo "Releases must be dispatched from main, not $RELEASE_REF"
            exit 1
          fi

          semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'

          if [[ ! "$VERSION" =~ $semver_pattern ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag already exists: $VERSION"
            exit 1
          fi

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          args=("$VERSION" --target "$GITHUB_SHA" --generate-notes --title "$VERSION")

          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"
