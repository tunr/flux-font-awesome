name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Laravel 12 / lowest
            php: '8.2'
            testbench: '^10.0'
            stability: prefer-lowest
          - name: Laravel 12 / latest
            php: '8.4'
            testbench: '^10.0'
            stability: prefer-stable
          - name: Laravel 13 / lowest
            php: '8.3'
            testbench: '^11.0'
            stability: prefer-lowest
          - name: Laravel 13 / latest
            php: '8.5'
            testbench: '^11.0'
            stability: prefer-stable

    name: ${{ matrix.name }} / PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Select Laravel test harness
        run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List installed framework versions
        run: |
          for package in laravel/framework livewire/flux orchestra/testbench phpunit/phpunit; do
            composer show "$package"
          done

      - name: Execute tests
        run: composer test

  quality:
    runs-on: ubuntu-latest
    name: Static analysis, style, and audit

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, mbstring
          coverage: none

      - name: Install latest supported dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit dependencies
        run: composer audit

      - name: Run static analysis
        run: composer larastan

      - name: Check code style
        run: composer pint:test

  required:
    needs: [test, quality]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    name: Required

    steps:
      - name: Verify required jobs passed
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          if [[ "$MATRIX_RESULT" != "success" || "$QUALITY_RESULT" != "success" ]]; then
            echo "Required checks failed: matrix=$MATRIX_RESULT quality=$QUALITY_RESULT"
            exit 1
          fi
